<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #f8f9fa, #e9ecef);
      }

      .card {
        border: 0;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="container d-flex align-items-center justify-content-center py-5">
      <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        <div class="card p-4 rounded-4">
          <h2 class="text-center mb-4">Welcome Back</h2>
          <p class="text-center text-muted mb-4">Please sign in to continue</p>

          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="name@example.com"
                required
              />
              <div class="invalid-feedback" id="emailError">
                Please enter a valid email address.
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="Enter your password"
                minlength="6"
                required
              />
              <div class="invalid-feedback" id="passwordError">
                Password must be at least 6 characters long.
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Login</button>
            <div id="formMessage" class="form-text mt-3 text-center"></div>
          </form>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const emailError = document.getElementById("emailError");
      const passwordError = document.getElementById("passwordError");
      const formMessage = document.getElementById("formMessage");

      function validateEmail(value) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        const emailValue = emailInput.value.trim();
        const passwordValue = passwordInput.value.trim();
        const isEmailValid = validateEmail(emailValue);
        const isPasswordValid = passwordValue.length >= 6;

        emailInput.classList.toggle("is-invalid", !isEmailValid);
        passwordInput.classList.toggle("is-invalid", !isPasswordValid);

        emailError.style.display = isEmailValid ? "none" : "block";
        passwordError.style.display = isPasswordValid ? "none" : "block";

        if (isEmailValid && isPasswordValid) {
          formMessage.textContent = "Login successful!";
          formMessage.className = "form-text mt-3 text-center text-success";
        } else {
          formMessage.textContent = "Please fix the highlighted fields.";
          formMessage.className = "form-text mt-3 text-center text-danger";
        }
      });

      [emailInput, passwordInput].forEach((input) => {
        input.addEventListener("input", function () {
          input.classList.remove("is-invalid");

          if (input === emailInput) {
            emailError.style.display = "none";
          } else {
            passwordError.style.display = "none";
          }

          formMessage.textContent = "";
          formMessage.className = "form-text mt-3 text-center";
        });
      });
    </script>
  </body>
</html>
